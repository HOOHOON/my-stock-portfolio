name: 주식 포트폴리오 비중 실시간 감시

on:
  schedule:
    # 매일 대한민국 기준 오전 08:30 (UTC 전날 23:30) - 혼잡 분 피하기 위한 30분 설정
    - cron: '30 23 * * *'
    # 매일 대한민국 기준 오전 08:50 (UTC 전날 23:50)
    - cron: '50 23 * * *'
  workflow_dispatch: # 깃허브 웹사이트에서 버튼 눌러 수동 실행 가능

permissions:
  contents: write

jobs:
  check_portfolio:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 차트 생성 필요 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: 포트폴리오 체크 & 텔레그램 알림/차트 전송
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python portfolio_checker.py

      - name: 대시보드 데이터(portfolio_data.json) 자동 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add portfolio_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update portfolio_data.json [skip ci]" && git push)

